services:
  postgresql:
    image: postgres:14
    container_name: ${CONTAINER_PREFIX:-banzai-}postgresql
    ports:
    - "${SITE_PG_HOST_PORT:-5442}:5432"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      - POSTGRES_DB=banzai_local
      - POSTGRES_USER=banzai
      - POSTGRES_HOST_AUTH_METHOD=trust
    volumes:
      - site-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U banzai -d banzai_local"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  banzai-cache-init:
    build: .
    container_name: ${CONTAINER_PREFIX:-banzai-}cache-init
    depends_on:
      postgresql:
        condition: service_healthy
    command: ["banzai_cache_init",
              "--db-address=${DB_ADDRESS}",
              "--aws-db-address=${AWS_DB_ADDRESS:-}",
              "--site-id=${SITE_ID}",
              "--publication-name=${PUBLICATION_NAME:-banzai_calibrations}",
              "--slot-name=${SLOT_NAME:-banzai_${SITE_ID}_slot}"]
    restart: "no"

  # NOTE: HOST_*_DIR paths must be absolute. Volumes are mounted at the same
  # path inside the container so that host-absolute file paths resolve as-is.

  # The site deployment is Smartstack-only: frames arrive via STACK_QUEUE_NAME
  # and are reduced by the stackframe worker. There is no realtime
  # (fits_files -> e91) pipeline at the site.

  banzai-download-worker:
    build: .
    container_name: ${CONTAINER_PREFIX:-banzai-}download-worker
    depends_on:
      banzai-cache-init:
        condition: service_completed_successfully
    volumes:
      - ${HOST_CALS_DIR}:${HOST_CALS_DIR}
    environment:
      - API_ROOT=${API_ROOT}
      - AUTH_TOKEN=${AUTH_TOKEN}
    command: ["banzai_download_worker",
              "--db-address=${DB_ADDRESS}",
              "--site-id=${SITE_ID}",
              "--instrument-types=${INSTRUMENT_TYPES:-*}",
              "--processed-path=${HOST_CALS_DIR}",
              "--poll-interval=${DOWNLOAD_WORKER_POLL_INTERVAL:-10}"]
    restart: unless-stopped

  banzai-stackframe-listener:
    build: .
    container_name: ${CONTAINER_PREFIX:-banzai-}stackframe-listener
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      banzai-cache-init:
        condition: service_completed_successfully
    environment:
      - DB_ADDRESS=${DB_ADDRESS}
      - CAL_DB_ADDRESS=${CAL_DB_ADDRESS:-${DB_ADDRESS}}
      - STACKFRAME_TASK_QUEUE_NAME=${STACKFRAME_TASK_QUEUE_NAME:-stackframe_reduction_task_queue}
      - STACK_QUEUE_NAME=${STACK_QUEUE_NAME:-banzai_stack_queue}
      - TASK_HOST=${REDIS_URL}
      - REDIS_URL=${REDIS_URL}
      - API_ROOT=${API_ROOT}
      - AUTH_TOKEN=${AUTH_TOKEN}
    command: ["banzai_stackframe_worker", "--broker-url=${RABBITMQ_URL}",
              "--db-address=${DB_ADDRESS}", "--rlevel=9",
              "--processed-path=${HOST_REDUCED_DIR}"]
    restart: unless-stopped

  banzai-stackframe-worker:
    build: .
    container_name: ${CONTAINER_PREFIX:-banzai-}stackframe-worker
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      banzai-cache-init:
        condition: service_completed_successfully
    volumes:
      - ${HOST_RAW_DIR}:${HOST_RAW_DIR}
      - ${HOST_CALS_DIR}:${HOST_CALS_DIR}
      - ${HOST_REDUCED_DIR}:${HOST_REDUCED_DIR}
    environment:
      - DB_ADDRESS=${DB_ADDRESS}
      - CAL_DB_ADDRESS=${CAL_DB_ADDRESS:-${DB_ADDRESS}}
      - TASK_HOST=${REDIS_URL}
      - STACKFRAME_TASK_QUEUE_NAME=${STACKFRAME_TASK_QUEUE_NAME:-stackframe_reduction_task_queue}
      - STACK_QUEUE_NAME=${STACK_QUEUE_NAME:-banzai_stack_queue}
      - REDIS_URL=${REDIS_URL}
      - BANZAI_WORKER_LOGLEVEL=${BANZAI_WORKER_LOGLEVEL}
      - OMP_NUM_THREADS=${OMP_NUM_THREADS}
      - API_ROOT=${API_ROOT}
      - AUTH_TOKEN=${AUTH_TOKEN}
      - DATA_ROOT=${HOST_REDUCED_DIR}
    command: ["celery", "-A", "banzai.scheduling", "worker",
              "--hostname", "banzai-stackframe-worker-${CELERY_HOSTNAME_SUFFIX:-local}",
              "-l", "${BANZAI_WORKER_LOGLEVEL}",
              "-c", "4",
              "-Q", "${STACKFRAME_TASK_QUEUE_NAME:-stackframe_reduction_task_queue}"]
    restart: unless-stopped

  banzai-stacking-supervisor:
    build: .
    container_name: ${CONTAINER_PREFIX:-banzai-}stacking-supervisor
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      banzai-cache-init:
        condition: service_completed_successfully
    volumes:
      - ${HOST_REDUCED_DIR}:${HOST_REDUCED_DIR}
    environment:
      - DB_ADDRESS=${DB_ADDRESS}
      - STACK_QUEUE_NAME=${STACK_QUEUE_NAME:-banzai_stack_queue}
      - SHIPPER_EXCHANGE=${SHIPPER_EXCHANGE:-ship_files}
      - SHIPPER_QUEUE_NAME=${SHIPPER_QUEUE_NAME:-ship}
      - SMARTSTACK_PREVIEWS=${SMARTSTACK_PREVIEWS:-true}
      - FINALIZE_BACKOFF_SECONDS=${FINALIZE_BACKOFF_SECONDS:-60,300,900,3600}
      - DATA_ROOT=${HOST_REDUCED_DIR}
    command: [
      "banzai_stacking_supervisor",
      "--site-id=${SITE_ID}",
      "--instrument-types=${INSTRUMENT_TYPES:-*}",
      "--db-address=${DB_ADDRESS}",
      "--broker-url=${RABBITMQ_URL}",
      "--processed-path=${HOST_REDUCED_DIR}",
      "--stack-retention-days=${STACK_RETENTION_DAYS:-30}",
      "--stack-timeout-minutes=${STACK_TIMEOUT_MINUTES:-20}"
    ]
    restart: always

volumes:
  site-pgdata:
